<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{block "title" .}}{{end}} · monolith</title>
  <link rel="stylesheet" href="/static/app.css">
  {{block "head" .}}{{end}}
  <script>document.documentElement.toggleAttribute("data-sidebar-collapsed", localStorage.getItem("sidebar-collapsed") === "1")</script>
</head>
<body>
  {{block "body" .}}
  <aside>
    <header>
      <span class="brand">monolith</span>
      <button type="button" aria-label="Toggle sidebar" onclick="localStorage.setItem('sidebar-collapsed', document.documentElement.toggleAttribute('data-sidebar-collapsed') ? '1' : '')">«</button>
    </header>
    <nav>
      <a href="/dashboard"{{if current "/dashboard"}} aria-current="page"{{end}}>Dashboard</a>
      <a href="/drive"{{if current "/drive"}} aria-current="page"{{end}}>Drive</a>
      <section>
        <h2>Finance</h2>
        <a href="/finance/assets"{{if current "/finance/assets"}} aria-current="page"{{end}}>Assets</a>
        <a href="/finance/expenses"{{if current "/finance/expenses"}} aria-current="page"{{end}}>Expenses</a>
      </section>
    </nav>
    <form method="post" action="/auth/logout">
      <button type="submit">Log out</button>
    </form>
  </aside>
  <main hx-target="main" hx-select="main" hx-swap="outerHTML">
    {{template "content" .}}
  </main>
  {{end}}
</body>
</html>
