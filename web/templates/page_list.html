{{define "title"}}Pages{{end}}
{{define "content"}}
<header>
  <h1>Pages</h1>
  <div class="actions">
    <form method="post" action="/page/pages/new">
      <button type="submit" class="primary">New page</button>
    </form>
  </div>
</header>
{{if .}}
<ul>
  {{range .}}<li><a href="{{.URL}}">{{.Title}}</a></li>{{end}}
</ul>
{{else}}
<p>No pages yet.</p>
{{end}}
<p><a href="/page/search">Search</a> · <a href="/page/trash">Trash</a></p>
{{end}}
