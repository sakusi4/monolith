{{define "attachments"}}
<section aria-labelledby="attachments">
  <h2 id="attachments">Attachments</h2>
  {{if .Trashed}}
  <p>The folder is in the trash.</p>
  {{else if .Files}}
  <ul>
    {{range .Files}}<li><a href="{{.URL}}">{{.Name}}</a> <small>{{.Kind}} · {{.Size}}</small></li>{{end}}
  </ul>
  {{else}}
  <p>No attachments.</p>
  {{end}}
  {{with .URL}}<p><a href="{{.}}">Open in Drive</a></p>{{end}}
</section>
{{end}}
